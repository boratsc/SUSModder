<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=640, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:640px; height:640px; overflow:hidden; background:#000; }

  /* Cover – splashscreen.jpg przykrywa całość przez pierwsze chwile.
     Potem znika, odsłaniając wideo. */
  #cover {
    position: absolute;
    top: 0; left: 0;
    width: 640px; height: 640px;
    background: url('SPLASH_JPG_FILE') center/cover no-repeat;
    z-index: 10;
    transition: opacity 0.4s ease-in;
    opacity: 1;
  }
  #cover.hidden { opacity: 0; pointer-events: none; }

  /* Wideo pod coverym, startuje schowane */
  video {
    position: absolute;
    top: 0; left: 0;
    width: 640px; height: 640px;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <div id="cover"></div>
  <video id="splash" muted playsinline preload="auto">
    <source src="VIDEO_SRC" type="video/mp4">
  </video>
  <script>
    (function() {
      var video = document.getElementById('splash');
      var cover = document.getElementById('cover');

      // Krok 1: Poczekaj aż wideo będzie w pełni załadowane
      video.addEventListener('canplaythrough', function onReady() {
        video.removeEventListener('canplaythrough', onReady);

        // Krok 2: Daj jeszcze chwilę na stabilizację WebView2
        setTimeout(function() {
          // Krok 3: Schowaj cover, odsłoń wideo
          cover.classList.add('hidden');

          // Krok 4: Odtwórz wideo od początku, bez pętli
          video.loop = false;
          video.currentTime = 0;
          video.play();
        }, 1500); // dodatkowe 1.5s stabilizacji
      });

      // Gdy wideo się skończy – pokaż cover z powrotem (splashscreen.jpg)
      video.addEventListener('ended', function() {
        cover.classList.remove('hidden');
      });
    })();
  </script>
</body>
</html>
