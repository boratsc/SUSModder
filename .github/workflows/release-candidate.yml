name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 3.1.0 or 3.1.0-beta)"
        required: true
        type: string
      channel:
        description: "Velopack channel"
        required: true
        type: choice
        options:
          - beta
          - release
        default: beta
      publishTarget:
        description: "Where to publish artifacts"
        required: true
        type: choice
        options:
          - github-draft+server
          - github-draft
          - none
        default: github-draft+server
      signingMode:
        description: "Authenticode signing mode"
        required: true
        type: choice
        options:
          - signpath
          - none
        default: signpath
      changelogMarkdown:
        description: "User-facing changelog bullets for Discord (empty = announce without changes block)"
        required: false
        type: string
        default: ""
      discordTeaser:
        description: "Optional Discord teaser line (e.g. Niedługo 3.0.13-beta)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: release-candidate-${{ github.event.inputs.channel }}
  cancel-in-progress: false

jobs:
  build-pack-publish:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce signing policy
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        shell: pwsh
        run: |
          $signingMode = "${{ github.event.inputs.signingMode }}"
          Write-Host "Channel=${{ github.event.inputs.channel }} SigningMode=$signingMode PublishTarget=${{ github.event.inputs.publishTarget }}"

          if ($signingMode -eq "signpath") {
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += "secrets.SIGNPATH_API_TOKEN" }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += "vars.SIGNPATH_ORGANIZATION_ID" }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += "vars.SIGNPATH_PROJECT_SLUG" }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += "vars.SIGNPATH_SIGNING_POLICY_SLUG" }
            if ($missing.Count -gt 0) {
              throw ("SignPath selected but configuration is incomplete: {0}" -f ($missing -join ', '))
            }
            Write-Host "SignPath configuration present."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Secrets.cs
        env:
          SUSMODDER_DOWNLOAD_TOKEN: ${{ secrets.SUSMODDER_DOWNLOAD_TOKEN }}
          SUSMODDER_7Z_PASSWORD: ${{ secrets.SUSMODDER_7Z_PASSWORD }}
        shell: pwsh
        run: .\SKRYPTY\Build\generate-secrets.ps1

      - name: Restore / Build / Test
        shell: pwsh
        run: |
          dotnet restore SUSModder.sln
          dotnet build SUSModder.sln -c Release --no-restore
          dotnet test SUSModder.Core.Tests/SUSModder.Core.Tests.csproj -c Release --no-build

      - name: Pack single channel (Velopack)
        id: pack
        shell: pwsh
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          $version = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version input is required" }

          if ($channel -eq "beta") {
            .\SKRYPTY\Build\build-dual-channel.ps1 -Version $version -SkipRelease
            $releasesDir = Join-Path $PWD "releases-beta"
          } else {
            .\SKRYPTY\Build\build-dual-channel.ps1 -Version $version -SkipBeta
            $releasesDir = Join-Path $PWD "releases-release"
          }

          if (-not (Test-Path $releasesDir)) { throw "Missing releases dir: $releasesDir" }

          Write-Host "=== Authenticode status (pre-sign) ==="
          $peFiles = @(Get-ChildItem -Path $releasesDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          foreach ($pe in $peFiles) {
            Write-Host "--- $($pe.Name) ---"
            Get-AuthenticodeSignature $pe.FullName | Format-List Status, StatusMessage, SignerCertificate | Out-String | Write-Host
          }

          "releases_dir=$releasesDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version-$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare SignPath unsigned bundle
        if: github.event.inputs.signingMode == 'signpath'
        id: signpath_prepare
        shell: pwsh
        run: |
          $releasesDir = "${{ steps.pack.outputs.releases_dir }}"
          $unsignedDir = Join-Path $PWD "signpath-unsigned"
          & .\SKRYPTY\Build\Prepare-SignPathBundle.ps1 -ReleasesDir $releasesDir -OutputDir $unsignedDir
          "unsigned_dir=$unsignedDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned artifact for SignPath
        if: github.event.inputs.signingMode == 'signpath'
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-${{ github.event.inputs.channel }}-${{ github.event.inputs.version }}
          path: ${{ steps.signpath_prepare.outputs.unsigned_dir }}
          retention-days: 1
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: github.event.inputs.signingMode == 'signpath'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'velopack-channel' }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}\signpath-signed
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply signed artifacts
        if: github.event.inputs.signingMode == 'signpath'
        shell: pwsh
        run: |
          Write-Host "SignPath request: ${{ steps.signpath.outputs.signing-request-web-url }}"
          $releasesDir = "${{ steps.pack.outputs.releases_dir }}"
          $signedDir = Join-Path $PWD "signpath-signed"
          $mapPath = Join-Path $releasesDir "signpath-map.json"
          & .\SKRYPTY\Build\Apply-SignPathBundle.ps1 -SignedDir $signedDir -ReleasesDir $releasesDir -MapPath $mapPath
          & .\SKRYPTY\Build\Assert-AuthenticodeSigned.ps1 -ReleasesDir $releasesDir

      - name: Finalize release artifacts
        id: finalize
        shell: pwsh
        run: |
          $channel = "${{ steps.pack.outputs.channel }}"
          $version = "${{ steps.pack.outputs.version }}"
          $releasesDir = "${{ steps.pack.outputs.releases_dir }}"
          $signingMode = "${{ github.event.inputs.signingMode }}"

          # CI-only metadata — do not ship to server / GH draft bundle
          $mapPath = Join-Path $releasesDir "signpath-map.json"
          if (Test-Path $mapPath) { Remove-Item $mapPath -Force }

          Write-Host "=== Authenticode status (final) ==="
          $peFiles = @(Get-ChildItem -Path $releasesDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          foreach ($pe in $peFiles) {
            Write-Host "--- $($pe.Name) ---"
            Get-AuthenticodeSignature $pe.FullName | Format-List Status, StatusMessage, SignerCertificate | Out-String | Write-Host
          }

          $hashes = @()
          Get-ChildItem $releasesDir -File | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$sha  $($_.Name)"
            Write-Host "$($_.Name): $sha"
          }
          $hashesPath = Join-Path $releasesDir "SHA256SUMS.txt"
          Set-Content -Path $hashesPath -Value ($hashes -join "`n") -Encoding UTF8

          $ghAssetsDir = Join-Path $PWD "gh-release-assets"
          if (Test-Path $ghAssetsDir) { Remove-Item $ghAssetsDir -Recurse -Force }
          New-Item -ItemType Directory -Path $ghAssetsDir -Force | Out-Null

          $installerUrl = "https://susmodder.app/releases/SUSModderInstaller.exe"
          $installerDest = Join-Path $ghAssetsDir "SUSModderInstaller.exe"
          Write-Host "Downloading stable installer: $installerUrl"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerDest -UseBasicParsing
          if (-not (Test-Path $installerDest) -or ((Get-Item $installerDest).Length -lt 1KB)) {
            throw "Failed to download SUSModderInstaller.exe from $installerUrl"
          }

          $portable = Get-ChildItem $releasesDir -Filter "*Portable.zip" -File | Select-Object -First 1
          if (-not $portable) { throw "Portable.zip not found in $releasesDir" }
          Copy-Item $portable.FullName -Destination (Join-Path $ghAssetsDir $portable.Name) -Force

          $setup = Get-ChildItem $releasesDir -Filter "*Setup.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found in $releasesDir" }
          Copy-Item $setup.FullName -Destination (Join-Path $ghAssetsDir $setup.Name) -Force

          Write-Host "GH draft assets ($channel): $($portable.Name) + $($setup.Name) + SUSModderInstaller.exe (signingMode=$signingMode)"

          $zipPath = Join-Path $PWD "SUSModder-$version-$channel-velopack.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Get-ChildItem -Path $releasesDir -File | ForEach-Object FullName) -DestinationPath $zipPath -Force

          "releases_dir=$releasesDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "gh_assets_dir=$ghAssetsDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=${{ steps.pack.outputs.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signing_mode=$signingMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload temporary workflow artifact
        if: github.event.inputs.publishTarget != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: susmodder-${{ github.event.inputs.channel }}-${{ github.event.inputs.version }}
          path: ${{ steps.finalize.outputs.zip_path }}
          retention-days: 1
          if-no-files-found: error

      - name: Create GitHub Release draft
        if: contains(github.event.inputs.publishTarget, 'github-draft')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.finalize.outputs.tag }}
          name: SUSModder ${{ github.event.inputs.version }} (${{ github.event.inputs.channel }})
          draft: true
          prerelease: ${{ github.event.inputs.channel == 'beta' }}
          fail_on_unmatched_files: false
          body: |
            ${{ github.event.inputs.changelogMarkdown != '' && format('## Changelog\n\n{0}\n\n', github.event.inputs.changelogMarkdown) || '' }}## Signing / provenance
            - Channel: `${{ github.event.inputs.channel }}`
            - Authenticode: `${{ github.event.inputs.signingMode }}` (signpath = SignPath Foundation / OSSign; none = unsigned)
            - Built by: GitHub Actions `${{ github.workflow }}` @ `${{ github.sha }}`

            ## Notes
            - Always attached: `SUSModderInstaller.exe` (stable bootstrapper from https://susmodder.app/releases/SUSModderInstaller.exe)
            - Also attached: `*Portable.zip` and built `*Setup.exe` (beta and release)
            - Velopack packages (nupkg / RELEASES / manifests) are deployed to susmodder.app — not attached here
          files: |
            ${{ steps.finalize.outputs.gh_assets_dir }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to susmodder.app
        if: contains(github.event.inputs.publishTarget, 'server')
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          $hostName = if ($env:DEPLOY_HOST) { $env:DEPLOY_HOST } else { "vps-b99a39c3.vps.ovh.net" }
          $userName = if ($env:DEPLOY_USER) { $env:DEPLOY_USER } else { "debian" }

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_PRIVATE_KEY)) {
            throw "DEPLOY_SSH_PRIVATE_KEY secret is required for server publish."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "deploy_key"
          $raw = $env:DEPLOY_SSH_PRIVATE_KEY.Trim()

          # Prefer Base64 secret (reliable in GitHub Actions). Also accept PEM with real or literal \n.
          if ($raw -notmatch '-----BEGIN') {
            try {
              $pem = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw))
            } catch {
              throw "DEPLOY_SSH_PRIVATE_KEY is neither PEM nor valid Base64. Paste Base64 of the private key file."
            }
          } else {
            $pem = $raw -replace '\\n', "`n"
          }

          $pem = $pem -replace "`r`n", "`n" -replace "`r", "`n"
          if (-not $pem.EndsWith("`n")) { $pem += "`n" }

          if ($pem -notmatch '-----BEGIN OPENSSH PRIVATE KEY-----' -or $pem -notmatch '-----END OPENSSH PRIVATE KEY-----') {
            throw "Decoded SSH key missing OpenSSH BEGIN/END markers (invalid format)."
          }

          [System.IO.File]::WriteAllText($keyPath, $pem, [System.Text.UTF8Encoding]::new($false))

          & icacls.exe $keyPath /inheritance:r | Out-Null
          & icacls.exe $keyPath /grant:r "${env:USERNAME}:(R)" | Out-Null

          # Quick local validation without printing key material
          $probe = & ssh.exe -i $keyPath -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "${userName}@${hostName}" "echo SSH_OK"
          if ($LASTEXITCODE -ne 0) {
            throw "SSH key auth probe failed (exit $LASTEXITCODE). Output: $probe"
          }
          Write-Host "SSH probe OK"

          # NOTE: do not name this $args — that is an automatic variable and breaks splatting
          $deployArgs = @{
            ReleaseVersion = "${{ github.event.inputs.version }}"
            Server         = $hostName
            Username       = $userName
            SshKeyPath     = $keyPath
            SkipLegacy     = $true
            Force          = $true
            SkipRelease    = ($channel -ne "release")
            SkipBeta       = ($channel -ne "beta")
          }

          & .\SKRYPTY\Build\deploy-to-server.ps1 @deployArgs
          if ($LASTEXITCODE -ne 0) { throw "deploy-to-server.ps1 failed with exit $LASTEXITCODE" }

      - name: Announce on Discord
        if: ${{ success() && contains(github.event.inputs.publishTarget, 'server') }}
        env:
          DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}
          CHANGELOG_MARKDOWN: ${{ github.event.inputs.changelogMarkdown }}
          DISCORD_TEASER: ${{ github.event.inputs.discordTeaser }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          $version = "${{ github.event.inputs.version }}".Trim()
          $tag = "${{ steps.pack.outputs.tag }}"

          if ([string]::IsNullOrWhiteSpace($env:DC_WEBHOOK)) {
            throw "DC_WEBHOOK secret is required for Discord announcement after server deploy."
          }

          & .\SKRYPTY\Build\Send-DiscordReleaseAnnouncement.ps1 `
            -Channel $channel `
            -Version $version `
            -ReleaseTag $tag

          if ($LASTEXITCODE -ne 0) {
            throw "Send-DiscordReleaseAnnouncement.ps1 failed with exit $LASTEXITCODE"
          }
